name: CI

on:
  pull_request:
    branches: [main]

# A new commit supersedes the previous build for the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # Don't burn Actions minutes on external PRs from forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Keep Next's incremental compiler cache warm between commits in this PR.
      # The SHA makes each completed run publish a fresh immutable cache, while
      # the restore prefix selects the newest cache from an earlier commit.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-pr-${{ github.event.pull_request.number }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-pr-${{ github.event.pull_request.number }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-pr-${{ github.event.pull_request.number }}-

      - name: Generate catalog and guides manifest
        run: |
          node scripts/fetch-catalog.mjs
          node scripts/build-guides-manifest.mjs

      # Tests are bun:test and need node_modules, so this runs after install.
      # No PostHog token is set here on purpose: analytics must stay inert
      # without one, and the suite asserts that.
      - name: Test
        run: bun test

      # Next's production build includes TypeScript validation, so running the
      # standalone `tsc --noEmit` from `pnpm lint` would duplicate that work.
      - name: Build
        run: pnpm exec next build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ZnJlZS1taXRlLTYuY2xlcmsuYWNjb3VudHMuZGV2JA' }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Build search index
        run: node scripts/build-search-index.mjs
