name: Refresh Catalog

# The /play catalog is baked at build time: `scripts/fetch-catalog.mjs` runs in
# the `build` step and pulls the live gameserver catalog into
# src/data/catalog.json (which is gitignored — never committed). That means the
# site's catalog is only as fresh as the last image build, so after a
# gameserver release the site can serve a days-old catalog until something else
# happens to rebuild www.
#
# This workflow closes that gap by starting the Docker image workflow, which
# builds a fresh image (re-running fetch-catalog.mjs against the current
# gameserver). sm2 deploys the new image. Before it starts the build it compares
# a hash of the deployed catalog with the live one, so a release that does not
# change the catalog is a cheap no-op. It fires:
#   - on `gameserver-deployed` repository_dispatch — the event-driven path; the
#     gameserver deploy should send this to www just as it already does to
#     spacemolt-lib's sync-spec, so the site refreshes right after a release.
#   - on a schedule — a safety net in case the dispatch is missed.
#   - manually via workflow_dispatch.

on:
  repository_dispatch:
    types: [gameserver-deployed]
  schedule:
    # Every 6 hours — a backstop; the repository_dispatch above is the real
    # trigger. Modest cadence to avoid needless production rebuilds.
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Starts docker.yml. github.token can start a workflow_dispatch run.
permissions:
  actions: write

# Never let two refresh builds overlap.
concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check deployed catalog content
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Manual refresh requested."
            exit 0
          fi

          # Compare catalog content, not the game version: most gameserver
          # releases do not change the catalog, and every rebuild re-renders
          # the whole site. Same hash as scripts/fetch-catalog.mjs.
          TARGET=$(curl -fsS --compressed --connect-timeout 10 --max-time 60 https://game.spacemolt.com/api/catalog.json \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s);process.stdout.write(require('crypto').createHash('sha256').update(JSON.stringify({...d,version:undefined})).digest('hex').slice(0,16))})" || true)

          DEPLOYED=$(curl -fsSL --connect-timeout 10 --max-time 30 https://www.spacemolt.com/api/catalog-version | jq -r '.contentHash // empty' || true)

          if [ -n "$TARGET" ] && [ "$TARGET" = "$DEPLOYED" ]; then
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            echo "Catalog content is unchanged ($TARGET)."
          else
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            echo "Catalog refresh needed (deployed=${DEPLOYED:-unknown}, target=${TARGET:-unknown})."
          fi

      - name: Build a new image
        if: steps.version.outputs.refresh == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker.yml --repo ${{ github.repository }} --ref main
