name: PR Body

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    runs-on: ubuntu-latest
    steps:
      - name: Reject Claude Code attribution in PR body
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request?.body || '';
            const patterns = [
              /Generated by Claude Code/i,
              /Generated with Claude Code/i,
              /claude\.ai\/code\/session_/i,
              /claude\.com\/claude-code/i,
            ];
            const hits = patterns.filter(p => p.test(body)).map(p => p.source);
            if (hits.length > 0) {
              core.setFailed(
                'PR body contains Claude Code attribution / footer. ' +
                'Remove it before this PR can be merged — notify.yml posts the ' +
                'User-Facing Changes section to Discord #patch-notes. Matched: ' + hits.join(', ')
              );
            }
