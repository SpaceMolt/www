name: Release Notification

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  # Re-post a merged PR's notes by hand. GitHub cannot retry a run that failed
  # at startup, so this is the only way to resend one.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the merged PR to announce
        required: true
        type: number

jobs:
  notify:
    # Only run on merged PRs (a manual run checks that in its first step)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    # This job only posts to a Discord webhook; it needs no repo write.
    # pull_request_target defaults GITHUB_TOKEN to read/write, so scope it down.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Load the pull request
        # Both triggers end with the PR as JSON in /tmp/pr.json; later steps read only that file.
        env:
          EVENT_PR: ${{ toJSON(github.event.pull_request) }}
          PR_NUMBER_INPUT: ${{ inputs.pr_number }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$PR_NUMBER_INPUT" ]; then
            gh api "repos/$REPO/pulls/$PR_NUMBER_INPUT" > /tmp/pr.json
            if [ "$(jq -r .merged /tmp/pr.json)" != "true" ]; then
              echo "PR #$PR_NUMBER_INPUT is not merged; nothing to announce."
              exit 1
            fi
          else
            printf '%s' "$EVENT_PR" > /tmp/pr.json
          fi

      - name: Extract release notes from PR body
        id: notes
        run: |
          cat > /tmp/parse_notes.py << 'PYEOF'
          import re, json, os

          with open('/tmp/pr.json') as f:
              body = json.load(f).get('body') or ''

          # Extract content under "## User-Facing Changes" heading
          match = re.search(
              r'##\s*User-Facing Changes\s*\n(.*?)(?=\n##\s|\Z)',
              body,
              re.DOTALL | re.IGNORECASE
          )

          # Attribution footers must never reach the public channel, even when
          # the PR body check was bypassed or the body was edited after merge.
          attribution = re.compile(
              r'generated (by|with) claude code|claude\.ai/code|claude\.com/claude-code',
              re.IGNORECASE,
          )

          notes = []
          if match:
              text = match.group(1)
              # Remove HTML comments (template placeholders)
              text = re.sub(r'<!--.*?-->', '', text, flags=re.DOTALL).strip()
              # A horizontal rule ends the notes; footers sit below it.
              text = re.split(r'^\s*-{2,}\s*$', text, maxsplit=1, flags=re.MULTILINE)[0]
              if text:
                  for line in text.split('\n'):
                      line = re.sub(r'^[-*•]\s*', '', line.strip()).strip()
                      if line and not attribution.search(line):
                          notes.append(line)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'NOTES_JSON={json.dumps(notes)}\n')
              f.write(f'HAS_NOTES={"true" if notes else "false"}\n')
          PYEOF

          python3 /tmp/parse_notes.py

      - name: Send Discord notification
        # PR-controlled values come from /tmp/pr.json into quoted "$VAR"s and
        # secrets via env, so attacker-controlled text (PR title/body) is never
        # interpolated into the script — prevents shell injection.
        env:
          HAS_NOTES: ${{ steps.notes.outputs.HAS_NOTES }}
          NOTES_JSON: ${{ steps.notes.outputs.NOTES_JSON }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          PR_TITLE=$(jq -r .title /tmp/pr.json)
          PR_NUMBER=$(jq -r .number /tmp/pr.json)
          PR_URL=$(jq -r .html_url /tmp/pr.json)
          if [ "$HAS_NOTES" = "true" ]; then
            # Format notes as bullet points
            NOTES_TEXT=$(echo "$NOTES_JSON" | python3 -c "
          import sys, json
          notes = json.load(sys.stdin)
          print('\n'.join(f'• {n}' for n in notes))
          ")
            DESCRIPTION="**[PR #${PR_NUMBER}: ${PR_TITLE}](${PR_URL})**

          ${NOTES_TEXT}"
            COLOR=2067276  # green
          else
            DESCRIPTION="Internal change: [${PR_TITLE}](${PR_URL})"
            COLOR=8421504  # gray
          fi

          PAYLOAD=$(jq -n \
            --arg desc "$DESCRIPTION" \
            --argjson color "$COLOR" \
            '{
              "embeds": [{
                "title": "Website Updated",
                "description": $desc,
                "color": $color,
                "footer": { "text": "spacemolt.com" }
              }]
            }')

          curl -s -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "$DISCORD_WEBHOOK_URL"
